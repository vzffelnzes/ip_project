stages:
  - test
  - build
  - deploy

variables:
  IMAGE_NAME: $CI_REGISTRY_IMAGE:latest
  POSTGRES_DB: bot_db
  POSTGRES_USER: bot_user
  POSTGRES_PASSWORD: bot_password

# Установка зависимостей и тесты
test:
  image: python:3.11
  stage: test
  services:
    - postgres:16-alpine
  variables:
    DATABASE_URL: postgresql+asyncpg://postgres:password@localhost/mydatabase
  before_script:
    - pip install --upgrade pip
    - pip install -r requirements.txt
    - pip install pytest # если будешь писать тесты
  script:
    - python -m pytest tests/ --verbose # если есть тесты
    - echo "✅ Тесты пройдены (или пропущены)"

# Сборка образа
build:
  image: docker:20.10.16
  stage: build
  services:
    - docker:20.10.16-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $IMAGE_NAME .
    - docker push $IMAGE_NAME
  only:
    - main

# Опционально: деплой (например, на сервер с Docker)
deploy:
  image: alpine:latest
  stage: deploy
  before_script:
    - apk add --no-cache openssh-client sshpass
  script:
    - sshpass -p "$SSH_PASS" ssh -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST "
      docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY &&
      docker pull $IMAGE_NAME &&
      docker stop tg_bot || true &&
      docker rm tg_bot || true &&
      docker run -d --name tg_bot --env-file ./bot.env $IMAGE_NAME
      "
  environment:
    name: production
  only:
    - main
